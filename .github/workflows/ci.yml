name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Format, lint, test and check the Markdown
        run: bash scripts/check.sh

  site:
    name: Site
    runs-on: ubuntu-24.04
    env:
      ZOLA_VERSION: 0.23.6
      ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install Zola and wasm-bindgen
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          zola="zola-v$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/getzola/zola/releases/download/v$ZOLA_VERSION/$zola"
          echo "$ZOLA_SHA256  $zola" | sha256sum -c -
          tar -xzf "$zola" -C "$bin" zola
          bindgen="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSLO "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$bindgen.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $bindgen.tar.gz" | sha256sum -c -
          tar -xzf "$bindgen.tar.gz" --strip-components=1 -C "$bin" "$bindgen/wasm-bindgen"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: bash scripts/site.sh build

      - name: Check the site's links
        run: cargo xtask site check site/public https://vertyll.github.io/markright/

      - name: Upload the site
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  pages:
    name: Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # A tag builds the archives of its release; a run started by hand builds them too, without releasing, to try every
  # target before a tag depends on it.
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build the command
        run: cargo build --release --locked --package markright --target ${{ matrix.target }}

      - name: List the licenses of what it includes
        shell: bash
        run: cargo xtask licenses markright ${{ matrix.target }} > THIRD-PARTY-LICENSES.txt

      - name: Pack it, with its license and those of what it includes
        shell: bash
        run: |
          cp LICENSE THIRD-PARTY-LICENSES.txt "target/${{ matrix.target }}/release/"
          cd "target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/markright-${{ matrix.target }}.zip" markright.exe LICENSE THIRD-PARTY-LICENSES.txt
          else
            tar -czf "$GITHUB_WORKSPACE/markright-${{ matrix.target }}.tar.gz" markright LICENSE THIRD-PARTY-LICENSES.txt
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: markright-${{ matrix.target }}
          path: markright-${{ matrix.target }}.*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          # Only the archives: the run also holds the site's artifact, which is no part of the release.
          pattern: markright-*
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum markright-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" ./*
